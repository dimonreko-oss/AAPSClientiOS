name: AAPSClientiOS
options:
  bundleIdPrefix: com.nightaps
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  SWIFT_VERSION: "5.9"
  CODE_SIGN_STYLE: Automatic
targets:
  AAPSClientiOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nightaps.aapsclientios
      GENERATE_INFOPLIST_FILE: YES
      SUPPORTED_PLATFORMS: iphoneos iphonesimulator
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "14"
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: App/AAPSClientiOS.entitlements
    info:
      path: App/Info.plist
      properties:
        # App/Info.plist is GENERATED from these properties by xcodegen
        # (`info.path` above), so this block is the source of truth — never
        # hand-edit App/Info.plist, run `xcodegen generate` instead.
        #
        # `...resurrect` is a BGProcessingTask used as a resurrection path: a second,
        # independent budget biased toward charging-and-idle windows, which is where
        # an overnight phone actually sits. Both keys have to land together —
        # registering an identifier missing from BGTaskSchedulerPermittedIdentifiers
        # raises at launch, and submitting a BGProcessingTaskRequest without the
        # `processing` background mode throws NotPermitted.
        #
        # `audio` is a deliberate App Store 2.5.4 trade-off; see App/Background/AudioKeepAlive.swift.
        BGTaskSchedulerPermittedIdentifiers:
          - "com.nightaps.aapsclientios.refresh"
          - "com.nightaps.aapsclientios.resurrect"
        UIBackgroundModes: ["fetch", "audio", "processing"]
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    dependencies:
      - target: AAPSWidget
  AAPSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nightaps.aapsclientios.widget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Widget/Info.plist
      CODE_SIGN_ENTITLEMENTS: Widget/AAPSWidget.entitlements
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "14"
      SUPPORTED_PLATFORMS: iphoneos iphonesimulator
  AAPSClientiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.nightaps.aapsclientios.tests
    dependencies:
      - target: AAPSClientiOS
# Declared explicitly so xcodegen writes them to xcshareddata. Without this block a
# freshly generated project has no schemes at all until someone opens it in Xcode
# (which autocreates them into gitignored xcuserdata) — so `xcodebuild -scheme` fails
# on a clean checkout, which is exactly what CI is.
schemes:
  AAPSClientiOS:
    build:
      targets:
        AAPSClientiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AAPSClientiOSTests
  # Kept so the two-scheme invocation documented in README.md keeps working.
  AAPSClientiOSTests:
    build:
      targets:
        AAPSClientiOSTests: all
    test:
      config: Debug
      targets:
        - AAPSClientiOSTests
